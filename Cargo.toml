[workspace]
members = [
    "crates/app",
    "crates/avatar",
    "crates/engine",
    "crates/perception",
    "crates/types",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
senrigan-types = { path = "crates/types" }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
